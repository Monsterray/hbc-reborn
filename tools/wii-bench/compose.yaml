services:
  wii-bench:
    build: .
    image: wii-bench-lease
    restart: unless-stopped
    ports:
      - "4310:4310"
    volumes:
      - ./history:/data          # events-*.jsonl, gzipped after 7 days, archive/YYYY-MM.tar
    environment:
      KEEP_MONTHS: "0"           # months of monthly archives to keep; 0 keeps them forever
      # The Wiis, name=ip[:port] [pinned] [lacks:PART ...], comma-separated; the first takes
      # the jobs of dispatchers from before 1.10.8. `pinned`: only jobs added with --wii NAME
      # run there. `group:NAME`: --wii NAME then means any free Wii of the group (the monitor's
      # manage page and `wiibench.py wii` change pins and groups; the server keeps them in
      # ./history/pool.json, and they win over this line). `lacks:disc`: no job added with --needs disc runs there (devwii's drive reads
      # no disc, 2026-10-24).
      # Empty: one Wii, at each workstation's WII_BENCH_IP. See README "Several Wiis".
      WII_BENCH_WIIS: "devwii=192.168.8.213 lacks:disc group:dev, lrwii=192.168.8.243 pinned group:dev group:devprod, prod=192.168.8.200 pinned"
