name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wii:
    name: Channel DOL, banner and TMD (devkitPPC)
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    env:
      EXTRA_CFLAGS: -Werror
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools and PowerPC libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential zlib1g-dev xxd gettext python3 python3-venv
          dkp-pacman -Sy --needed --noconfirm ppc-zlib ppc-libpng ppc-mxml ppc-freetype ppc-bzip2 ppc-brotli
          dkp-pacman -Q | grep -E 'devkitPPC|libogc|ppc-'
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Build WiiPAX
        run: make -C wiipax EXTRA_CFLAGS="$EXTRA_CFLAGS"

      - name: Build the channel DOL
        run: make -C channel/channelapp channel EXTRA_CFLAGS="$EXTRA_CFLAGS"

      - name: Build the test apps
        run: |
          make -C tests/netlog_app EXTRA_CFLAGS="$EXTRA_CFLAGS"
          make -C tests/launch_title EXTRA_CFLAGS="$EXTRA_CFLAGS"

      - name: Build the banner
        run: make -C channel/banner PYTHON="$PWD/.venv/bin/python" EXTRA_CFLAGS="$EXTRA_CFLAGS"

      # The ticket and WAD need the private Wii common key, so CI stops at the TMD.
      - name: Build the WAD contents and TMD
        run: |
          make -C channel/title PYTHON="$PWD/.venv/bin/python" 00000000 00000001 retail/tmd
          .venv/bin/python pywii/pywii-tools/tmdinfo.py channel/title/retail/tmd channel/title/retail/certs

      - name: Tests
        run: |
          .venv/bin/python tests/release_version.py
          tests/stub_layout.sh
          tests/host_bounds.sh
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v

      - uses: actions/upload-artifact@v4
        with:
          name: channelapp-channel-dol
          path: |
            channel/channelapp/channelapp-channel.dol
            channel/channelapp/channelapp_nopax.elf
            channel/channelapp/channelapp.map
            tests/netlog_app/netlog_app.dol

  host:
    name: Host tools and Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          install: gcc make zlib-devel

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build host wiiload and banner tools with warnings as errors
        run: |
          make -C channel/wiiload EXTRA_CFLAGS=-Werror
          make -C channel/banner/tools EXTRA_CFLAGS=-Werror EXE="$([ "$RUNNER_OS" = Windows ] && echo .exe)"

      - name: Python tests
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          python tests/release_version.py
          python -m unittest discover -s tests -p 'test_*.py' -v
